[theme]
base = "dark"
backgroundColor = "#07111f"
secondaryBackgroundColor = "#0b1728"
textColor = "#eef5ff"
primaryColor = "#2d7df6"

[client]
# esconde a barra Share / editar / GitHub / Deploy e o menu de hambúrguer
toolbarMode = "minimal"
showSidebarNavigation = false
showErrorDetails = false

[server]
enableStaticServing = false
